[package]
name = "crystal-works"
version = "0.1.0"
description = "Crystal Works, the Fantasy Studio flagship, as a desktop game"
edition = "2021"

# the same crates as the studio shell (desktop/src-tauri), pinned by the same
# lock, so the flagship builds from what is already vetted and cached
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# STEAMWORKS (2026-09-29, approved by the user): the bindings are MIT or
# Apache-2.0; steamworks-sys carries Valve's redistributable steam_api64.dll,
# which is Valve's, redistributable with a game shipped on Steam. Only the
# "steam" build links it, so the plain desktop build stays open source and
# needs no DLL beside it.
steamworks = { version = "0.13", optional = true }

[features]
steam = ["dep:steamworks"]

[profile.release]
strip = true
lto = true
